<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
  <title>QR Code Generator</title>
  <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    :root { --ground:#e7e5e4; --paper:#f8f7f3; --ink:#082f49; --link:#0369a1; --muted:#57534e; --line:#c8c5c1; --wash:#e6e9e7; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.45 ui-serif,Georgia,"Times New Roman",serif; }
    .wrap { max-width:1110px; padding:2rem 2rem 3rem; margin:auto; }
    header.site { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:1.3rem; }
    .brand img { display:block; width:56px; height:56px; object-fit:contain; }
    header nav { display:flex; gap:1.3rem; }
    header nav a { font-size:.95rem; text-decoration:none; color:var(--muted); border-bottom:1px solid transparent; }
    header nav a:hover,header nav a.active { color:var(--ink); border-color:currentColor; }
    h1,h2,p { margin:0; }
    h1 { margin:1.4rem 0; font-size:2rem; line-height:1.2; letter-spacing:-.035em; }
    h2 { font-size:1.2rem; font-weight:500; }
    main { display:grid; grid-template-columns:minmax(0,1fr) minmax(270px,.8fr); grid-template-areas:"content preview" "settings preview"; align-items:start; gap:1rem 1.4rem; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:5px; min-width:0; }
    .content { grid-area:content; } .settings { grid-area:settings; } .preview-col { grid-area:preview; position:sticky; top:1rem; }
    .card-head { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem .2rem; }
    .card-body { padding:.6rem 1.2rem 1.1rem; }
    .lbl,.sec { display:block; color:var(--muted); font-size:.87rem; margin:0 0 .3rem; }
    button,input,select,textarea { font:inherit; color:var(--ink); }
    button,select,summary,input[type=checkbox],input[type=color] { cursor:pointer; }
    .text-input,select,.color-wrap,.pill,.btn { background:var(--paper); border:1px solid var(--line); border-radius:4px; }
    .text-input,select { display:block; width:100%; padding:.46rem .63rem; min-height:39px; }
    .text-input::placeholder { color:#78716c; } textarea { resize:vertical; }
    :focus-visible { outline:2px solid var(--link); outline-offset:2px; }
    .g2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.8rem; }
    .span2 { grid-column:1/-1; }
    .divider { margin:.75rem 0; border-top:1px solid var(--line); }
    .settings > details { border-top:1px solid var(--line); }
    summary { list-style:none; display:flex; align-items:center; justify-content:space-between; padding:.65rem 1.2rem; }
    summary::-webkit-details-marker { display:none; } summary::after { content:""; width:.45rem; height:.45rem; border:solid var(--muted); border-width:0 1.5px 1.5px 0; transform:rotate(45deg); margin-right:.25rem; }
    details[open] > summary::after { transform:rotate(225deg); }
    .pills,.color-swatches { display:flex; flex-wrap:wrap; gap:.3rem; }
    .pill,.btn { line-height:1.2; font-size:.9rem; padding:.4rem .65rem; }
    .pill.on,.btn-primary { border-color:var(--ink); background:var(--ink); color:var(--paper); }
    button:hover:not(:disabled),select:hover { border-color:var(--ink); }
    .color-wrap,.range-row,.check-row { display:flex; align-items:center; gap:.5rem; }
    .color-wrap { padding:.32rem .5rem; }
    .color-wrap.disabled { opacity:.45; pointer-events:none; }
    .color-wrap input[type=color] { border:0; padding:0; width:28px; height:28px; background:transparent; }
    .hex-input { border:0; min-width:0; width:100%; background:transparent; font: .85rem ui-monospace,monospace; }
    .color-swatches { margin-top:.4rem; }
    .swatch { width:18px; height:18px; padding:0; border:1px solid var(--line); border-radius:3px; }
    input[type=range] { min-width:0; width:100%; } input[type=range],input[type=checkbox] { accent-color:var(--ink); }
    .range-val { min-width:3rem; font-size:.85rem; text-align:right; color:var(--muted); }
    .check-row { font-size:.9rem; cursor:pointer; }
    .upload-zone { display:flex; align-items:center; justify-content:center; gap:.5rem; border:1px dashed var(--line); border-radius:4px; min-height:52px; position:relative; cursor:pointer; }
    .upload-zone input { position:absolute; inset:0; width:100%; opacity:0; cursor:pointer; }
    .upload-zone:focus-within { outline:2px solid var(--link); }
    #logo-preview { display:block; max-width:44px; max-height:44px; } #logo-preview[hidden] { display:none; }
    #logo-label { overflow-wrap:anywhere; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; }
    .btn-icon { border:0; padding:.25rem .1rem; background:none; color:var(--link); }
    .btn-icon:hover { text-decoration:underline; }
    .btn:disabled { opacity:.48; cursor:default; }
    .icon { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    .btn-primary { width:100%; min-height:40px; margin-top:.8rem; }
    .card-body .site-select, details .site-select { width:100%; }
    #qr-type, #qr-type-control { margin-bottom:14px; }
    .qr-stage { background:var(--ground); border-radius:3px; width:100%; height:clamp(240px,30vw,340px); padding:12px; }
    #qr-mount { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    #qr-mount > :is(canvas,svg) { display:block; width:auto; height:auto; max-width:100%; max-height:100%; }
    footer { margin-top:2rem; border-top:1px solid var(--line); padding-top:.8rem; color:var(--muted); font-size:.8rem; }
    footer a { color:var(--link); text-underline-offset:.15em; }
    .qr-empty { text-align:center; color:var(--muted); font-size:.88rem; }
    .qr-empty .icon { width:32px; height:32px; margin-bottom:.45rem; color:#78716c; }
    .export-row { display:grid; grid-template-columns:minmax(0,1fr) 5.6rem; gap:.6rem; margin-top:.85rem; }
    .export-row label { min-width:0; }
    [hidden] { display:none !important; }
    @media(max-width:720px) {
      .wrap { padding:1.2rem .85rem 2rem; } header.site { padding-bottom:.85rem; } header nav { gap:1rem; }
      h1 { font-size:1.7rem; margin:1rem 0; }
      main { grid-template-columns:minmax(0,1fr); grid-template-areas:"content" "preview" "settings"; gap:.75rem; }
      .preview-col { position:static; } .qr-stage { height:210px; }
      .card-head { padding:.8rem .9rem .1rem; } .card-body { padding:.6rem .9rem .85rem; } summary { padding:.65rem .9rem; }
    }
    @media(max-width:400px) { .g2 { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="https://sambarbeau.com/ui/select.css" />
  <script defer src="https://sambarbeau.com/ui/select.js"></script>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute"><defs><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v3h16v-3"/></symbol><symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 4v6h6M3 10a9 9 0 1 1 2 8"/></symbol><symbol id="i-clear" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M14 13h3v4h4v4h-4m-5-3v3"/></symbol></defs></svg>
<div class="wrap">
<header class="site">
  <a href="https://sambarbeau.com" class="brand" aria-label="Sam Barbeau — home"><img src="img/page_logo.png" alt="Sam Barbeau"></a>
  <nav aria-label="Site">
    <a href="https://sambarbeau.com">about</a>
    <a href="https://sambarbeau.com/projects.html" class="active" aria-current="location">projects</a>
    <a href="https://sambarbeau.com/travel.html">travel</a>
  </nav>
</header>
<h1>qr code generator</h1>
<main>
    <!-- Content -->
    <section class="card content">
      <div class="card-head"><h2>Content</h2><button class="btn btn-icon" onclick="clearContent()"><svg class="icon" aria-hidden="true"><use href="#i-clear"></use></svg>Clear</button></div>
      <div class="card-body">
        <label class="lbl" for="qr-type">Type</label>
        <select id="qr-type" class="text-input" onchange="renderTypeFields()">
          <option value="url">Website</option>
          <option value="text">Plain text</option>
          <option value="email">Email</option>
          <option value="phone">Phone number</option>
          <option value="sms">SMS message</option>
          <option value="wifi">WiFi network</option>
          <option value="vcard">Contact (vCard)</option>
          <option value="event">Calendar event</option>
          <option value="geo">Geo location</option>
        </select>
        <div id="type-fields"><!-- populated by JS --></div>
      </div>
    </section>
    <section class="card settings">
      <div class="card-head"><h2>Appearance</h2></div>
      <div class="card-body">
        <label for="preset" class="lbl">Preset</label>
        <select id="preset" onchange="applyPreset(this.value)">
          <option value="" disabled>Custom</option>
          <option value="classic">Classic Black</option>
          <option value="monoLight">Mono Light</option>
          <option value="monoDark">Mono Dark</option>
          <option value="navy">Navy on Cream</option>
          <option value="midnight">Midnight</option>
          <option value="ocean">Ocean</option>
          <option value="slate">Slate</option>
          <option value="paper">Paper</option>
          <option value="crimson">Crimson</option>
          <option value="brick">Brick &amp; Cream</option>
          <option value="steel">Steel Gradient</option>
          <option value="aqua">Aqua Gradient</option>
          <option value="dusk">Dusk Gradient</option>
          <option value="editorial">Editorial</option>
          <option value="dotsMin">Minimal Dots</option>
          <option value="transparent">Transparent BG</option>
        </select>
      </div>
    <details>
      <summary>Shapes</summary>
      <div class="card-body">
        <div class="sec">Dot Shape</div>
        <div class="pills" id="pills-dot">
          <button class="pill on" data-v="square"          onclick="setPill('pills-dot',this);scheduleUpdate()">Square</button>
          <button class="pill"    data-v="rounded"         onclick="setPill('pills-dot',this);scheduleUpdate()">Rounded</button>
          <button class="pill"    data-v="dots"            onclick="setPill('pills-dot',this);scheduleUpdate()">Dots</button>
          <button class="pill"    data-v="extra-rounded"   onclick="setPill('pills-dot',this);scheduleUpdate()">Extra Rounded</button>
          <button class="pill"    data-v="classy"          onclick="setPill('pills-dot',this);scheduleUpdate()">Classy</button>
          <button class="pill"    data-v="classy-rounded"  onclick="setPill('pills-dot',this);scheduleUpdate()">Classy Rounded</button>
        </div>

        <div class="divider"></div>
        <div class="sec">Corner Square Style</div>
        <div class="pills" id="pills-csq">
          <button class="pill on" data-v="square"        onclick="setPill('pills-csq',this);scheduleUpdate()">Square</button>
          <button class="pill"    data-v="extra-rounded" onclick="setPill('pills-csq',this);scheduleUpdate()">Rounded</button>
          <button class="pill"    data-v="dot"           onclick="setPill('pills-csq',this);scheduleUpdate()">Dot</button>
        </div>

        <div class="divider"></div>
        <div class="sec">Corner Dot Style</div>
        <div class="pills" id="pills-cdot">
          <button class="pill on" data-v="square" onclick="setPill('pills-cdot',this);scheduleUpdate()">Square</button>
          <button class="pill"    data-v="dot"    onclick="setPill('pills-cdot',this);scheduleUpdate()">Dot</button>
        </div>
      </div>
    </details>

    <details>
      <summary>Colors</summary>
      <div class="card-body">
        <div class="g2">
          <div>
            <label class="lbl" for="dot-color">Dot color</label>
            <div class="color-wrap">
              <input type="color" id="dot-color" value="#082F49" oninput="syncHex(this,'dot-hex');scheduleUpdate()" />
              <input type="text"  id="dot-hex" aria-label="Dot hex color"   class="hex-input" value="#082F49" maxlength="7" oninput="syncPicker(this,'dot-color');scheduleUpdate()" />
            </div>
            <div class="color-swatches" id="sw-dot"></div>
          </div>
          <div>
            <label class="lbl" for="bg-color">Background</label>
            <div class="color-wrap" id="bg-color-wrap">
              <input type="color" id="bg-color" value="#FFFFFF" oninput="syncHex(this,'bg-hex');scheduleUpdate()" />
              <input type="text"  id="bg-hex" aria-label="Background hex color"   class="hex-input" value="#FFFFFF" maxlength="7" oninput="syncPicker(this,'bg-color');scheduleUpdate()" />
            </div>
            <div style="margin-top:6px">
              <label class="check-row">
                <input type="checkbox" id="transparent-bg" onchange="onTransparentBg()" />
                <span>Transparent background</span>
              </label>
            </div>
            <div class="color-swatches" id="sw-bg"></div>
          </div>
          <div>
            <label class="lbl" for="csq-color">Corner color</label>
            <div class="color-wrap">
              <input type="color" id="csq-color" value="#082F49" oninput="syncHex(this,'csq-hex');scheduleUpdate()" />
              <input type="text"  id="csq-hex" aria-label="Corner hex color"   class="hex-input" value="#082F49" maxlength="7" oninput="syncPicker(this,'csq-color');scheduleUpdate()" />
            </div>
            <div class="color-swatches" id="sw-csq"></div>
          </div>
          <div>
            <label class="lbl" for="cdot-color">Corner dot color</label>
            <div class="color-wrap">
              <input type="color" id="cdot-color" value="#0369A1" oninput="syncHex(this,'cdot-hex');scheduleUpdate()" />
              <input type="text"  id="cdot-hex" aria-label="Corner dot hex color"   class="hex-input" value="#0369A1" maxlength="7" oninput="syncPicker(this,'cdot-color');scheduleUpdate()" />
            </div>
            <div class="color-swatches" id="sw-cdot"></div>
          </div>
        </div>

        <div class="divider"></div>
        <label class="check-row" style="margin-bottom:12px">
          <input type="checkbox" id="use-gradient" onchange="onGradientToggle()" />
          <span>Gradient dots</span>
        </label>
        <div id="gradient-opts" style="display:none" class="g2">
          <div>
            <label class="lbl" for="grad-start">Start color</label>
            <div class="color-wrap">
              <input type="color" id="grad-start" value="#082F49" oninput="syncHex(this,'grad-start-hex');scheduleUpdate()" />
              <input type="text"  id="grad-start-hex" aria-label="Start hex color" class="hex-input" value="#082F49" maxlength="7" oninput="syncPicker(this,'grad-start');scheduleUpdate()" />
            </div>
          </div>
          <div>
            <label class="lbl" for="grad-end">End color</label>
            <div class="color-wrap">
              <input type="color" id="grad-end" value="#0369A1" oninput="syncHex(this,'grad-end-hex');scheduleUpdate()" />
              <input type="text"  id="grad-end-hex" aria-label="End hex color" class="hex-input" value="#0369A1" maxlength="7" oninput="syncPicker(this,'grad-end');scheduleUpdate()" />
            </div>
          </div>
          <div>
            <label class="lbl" for="grad-type">Type</label>
            <select id="grad-type" onchange="scheduleUpdate()">
              <option value="linear">Linear</option>
              <option value="radial">Radial</option>
            </select>
          </div>
          <div>
            <label class="lbl" for="grad-rot">Rotation (°)</label>
            <div class="range-row">
              <input type="range" id="grad-rot" min="0" max="360" step="15" value="45"
                oninput="$('grad-rot-val').textContent=this.value+'°';scheduleUpdate()" />
              <span class="range-val" id="grad-rot-val">45°</span>
            </div>
          </div>
        </div>
      </div>
    </details>

    <details>
      <summary>Center logo</summary>
      <div class="card-body">
        <label class="check-row" style="margin-bottom:14px">
          <input type="checkbox" id="use-logo" onchange="onLogoToggle()" />
          <span>Show logo in center</span>
        </label>
        <div id="logo-opts" style="display:none">
          <label class="upload-zone">
            <input type="file" id="logo-file" accept="image/*" onchange="onLogoUpload(event)">
            <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><img id="logo-preview" alt="" hidden><span id="logo-label">Choose image</span>
          </label>
          <button class="btn btn-icon" id="remove-logo" onclick="clearLogo()" hidden>Remove image</button>
          <div class="divider"></div>
          <div class="g2">
            <div>
              <label class="lbl" for="logo-size">Logo size</label>
              <div class="range-row">
                <input type="range" id="logo-size" min="0.1" max="0.6" step="0.05" value="0.3"
                  oninput="$('logo-size-val').textContent=Math.round(this.value*100)+'%';scheduleUpdate()" />
                <span class="range-val" id="logo-size-val">30%</span>
              </div>
            </div>
            <div>
              <label class="lbl" for="logo-margin">Logo margin</label>
              <div class="range-row">
                <input type="range" id="logo-margin" min="0" max="20" step="1" value="6"
                  oninput="$('logo-margin-val').textContent=this.value+'px';scheduleUpdate()" />
                <span class="range-val" id="logo-margin-val">6px</span>
              </div>
            </div>
            <div class="span2">
              <label class="check-row">
                <input type="checkbox" id="hide-bg-dots" checked onchange="scheduleUpdate()" />
                <span>Hide background dots behind logo</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </details>

    <details>
      <summary>Size and quality</summary>
      <div class="card-body">
        <div class="g2">
          <div>
            <label class="lbl" for="qr-size">Canvas size</label>
            <div class="range-row">
              <input type="range" id="qr-size" min="300" max="1000" step="50" value="500"
                oninput="$('qr-size-val').textContent=this.value+'px';scheduleUpdate()" />
              <span class="range-val" id="qr-size-val">500px</span>
            </div>
          </div>
          <div>
            <label class="lbl" for="qr-margin">Quiet zone</label>
            <div class="range-row">
              <input type="range" id="qr-margin" min="0" max="60" step="4" value="16"
                oninput="$('qr-margin-val').textContent=this.value+'px';scheduleUpdate()" />
              <span class="range-val" id="qr-margin-val">16px</span>
            </div>
          </div>
          <div class="span2">
            <label class="lbl" for="ecl">Error correction</label>
            <select id="ecl" onchange="scheduleUpdate()">
              <option value="L">L — Low (7%)</option>
              <option value="M">M — Medium (15%)</option>
              <option value="Q">Q — Quartile (25%)</option>
              <option value="H" selected>H — High (30%)</option>
            </select>
          </div>
        </div>
      </div>
    </details>

  </section>

  <!-- ══════════════ RIGHT: PREVIEW ══════════════ -->
  <div class="preview-col">

    <!-- Preview card -->
    <div class="card">
      <div class="card-head">
        <h2>Preview</h2>
        <button class="btn btn-outline btn-icon" style="margin-left:auto" onclick="resetAll()" title="Reset to defaults"><svg class="icon" aria-hidden="true"><use href="#i-reset"></use></svg>Reset</button>
      </div>
      <div class="card-body">
        <div class="qr-stage" id="qr-stage">
          <div id="qr-mount">
            <div class="qr-empty"><svg class="icon" aria-hidden="true"><use href="#i-qr"></use></svg><p>Enter content to preview your code.</p></div>
          </div>
        </div>
        <div class="export-row">
          <label><span class="lbl">Filename</span><input id="filename" class="text-input" value="qr-code"></label>
          <label><span class="lbl">Format</span><select id="export-format"><option value="png">PNG</option><option value="svg">SVG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label>
        </div>
        <button class="btn btn-primary" id="download" onclick="doDownload()" disabled><svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>Download</button>
      </div>
    </div>

  </div><!-- /preview-col -->

</main>
<footer>Built with <a href="https://github.com/kozakdenys/qr-code-styling">qr-code-styling</a></footer>
</div>

<script>
// ── Shorthand ──────────────────────────────────────────────
const $ = id => document.getElementById(id);

// ── Content type definitions ───────────────────────────────
const QR_TYPES = {
  url:   { fields: [{ id:'c-url', label:'URL', type:'text', placeholder:'https://...' }] },
  text:  { fields: [{ id:'c-text', label:'Text', type:'textarea', placeholder:'any text' }] },
  email: { fields: [
    { id:'c-email-to',  label:'To',      type:'text',     placeholder:'name@example.com' },
    { id:'c-email-sub', label:'Subject', type:'text',     placeholder:'(optional)' },
    { id:'c-email-bod', label:'Body',    type:'textarea', placeholder:'(optional)' },
  ]},
  phone: { fields: [{ id:'c-phone', label:'Phone number', type:'tel', placeholder:'+15551234567' }] },
  sms:   { fields: [
    { id:'c-sms-to',  label:'Phone',   type:'tel',      placeholder:'+15551234567' },
    { id:'c-sms-msg', label:'Message', type:'textarea', placeholder:'(optional)' },
  ]},
  wifi:  { fields: [
    { id:'c-wifi-ssid', label:'Network name (SSID)', type:'text', placeholder:'MyNetwork' },
    { id:'c-wifi-pass', label:'Password',            type:'password', placeholder:'' },
    { id:'c-wifi-enc',  label:'Encryption',          type:'select', options:[['WPA','WPA / WPA2'],['WEP','WEP'],['nopass','None']] },
  ]},
  vcard: { fields: [
    { id:'c-vc-name',  label:'Full name',  type:'text', placeholder:'Jane Doe' },
    { id:'c-vc-org',   label:'Organization', type:'text', placeholder:'(optional)' },
    { id:'c-vc-phone', label:'Phone',      type:'tel',  placeholder:'(optional)' },
    { id:'c-vc-email', label:'Email',      type:'text', placeholder:'(optional)' },
    { id:'c-vc-url',   label:'Website',    type:'text', placeholder:'(optional)' },
  ]},
  event: { fields: [
    { id:'c-ev-title', label:'Title',    type:'text', placeholder:'My event' },
    { id:'c-ev-loc',   label:'Location', type:'text', placeholder:'(optional)' },
    { id:'c-ev-start', label:'Start',    type:'datetime-local' },
    { id:'c-ev-end',   label:'End',      type:'datetime-local' },
  ]},
  geo:   { fields: [
    { id:'c-geo-lat', label:'Latitude',  type:'text', placeholder:'40.7128' },
    { id:'c-geo-lng', label:'Longitude', type:'text', placeholder:'-74.0060' },
  ]},
};

function renderTypeFields() {
  const type = $('qr-type').value;
  const def = QR_TYPES[type];
  const host = $('type-fields');
  host.innerHTML = def.fields.map(f => {
    const lbl = `<label class="lbl" for="${f.id}">${f.label}</label>`;
    if (f.type === 'textarea') {
      return `${lbl}<textarea id="${f.id}" class="text-input" rows="3" placeholder="${f.placeholder||''}" oninput="scheduleUpdate()" style="resize:vertical;font-family:inherit;width:100%"></textarea>`;
    }
    if (f.type === 'select') {
      const opts = f.options.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
      return `${lbl}<select id="${f.id}" class="text-input" onchange="scheduleUpdate()">${opts}</select>`;
    }
    return `${lbl}<input id="${f.id}" class="text-input" type="${f.type}" placeholder="${f.placeholder||''}" oninput="scheduleUpdate()" />`;
  }).join('<div style="height:10px"></div>');
  scheduleUpdate();
}

// Escape \ ; , : " for WiFi / vCard format
function escWifi(s) { return (s||'').replace(/([\\;,":])/g, '\\$1'); }
function escVcard(s) { return (s||'').replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n'); }
function fmtIcsDate(local) {
  if (!local) return '';
  // local is "YYYY-MM-DDTHH:MM"; treat as floating local time → strip punctuation, append no Z
  return local.replace(/[-:]/g, '') + '00';
}

function buildQrData() {
  const v = id => ($(id) ? $(id).value.trim() : '');
  const type = $('qr-type') ? $('qr-type').value : 'url';
  switch (type) {
    case 'url':   return v('c-url');
    case 'text':  return v('c-text');
    case 'email': {
      const to = v('c-email-to'); if (!to) return '';
      const params = [];
      if (v('c-email-sub')) params.push('subject=' + encodeURIComponent(v('c-email-sub')));
      if (v('c-email-bod')) params.push('body=' + encodeURIComponent(v('c-email-bod')));
      return `mailto:${to}` + (params.length ? '?' + params.join('&') : '');
    }
    case 'phone': return v('c-phone') ? `tel:${v('c-phone')}` : '';
    case 'sms':   return v('c-sms-to') ? `SMSTO:${v('c-sms-to')}:${v('c-sms-msg')}` : '';
    case 'wifi': {
      const ssid = v('c-wifi-ssid'); if (!ssid) return '';
      const enc  = v('c-wifi-enc') || 'WPA';
      const pass = v('c-wifi-pass');
      return `WIFI:T:${enc};S:${escWifi(ssid)};P:${escWifi(pass)};;`;
    }
    case 'vcard': {
      const name = v('c-vc-name'); if (!name) return '';
      const lines = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${escVcard(name)}`];
      if (v('c-vc-org'))   lines.push(`ORG:${escVcard(v('c-vc-org'))}`);
      if (v('c-vc-phone')) lines.push(`TEL:${v('c-vc-phone')}`);
      if (v('c-vc-email')) lines.push(`EMAIL:${v('c-vc-email')}`);
      if (v('c-vc-url'))   lines.push(`URL:${v('c-vc-url')}`);
      lines.push('END:VCARD');
      return lines.join('\n');
    }
    case 'event': {
      const title = v('c-ev-title'); const start = v('c-ev-start'); const end = v('c-ev-end');
      if (!title || !start || !end) return '';
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
        `SUMMARY:${escVcard(title)}`,
        `DTSTART:${fmtIcsDate(start)}`,
        `DTEND:${fmtIcsDate(end)}`,
      ];
      if (v('c-ev-loc')) lines.push(`LOCATION:${escVcard(v('c-ev-loc'))}`);
      lines.push('END:VEVENT', 'END:VCALENDAR');
      return lines.join('\n');
    }
    case 'geo':   {
      const lat = v('c-geo-lat'); const lng = v('c-geo-lng');
      return (lat && lng) ? `geo:${lat},${lng}` : '';
    }
  }
  return '';
}

// State
let qrCode      = null;
let logoDataUrl = null;       // active logo (only set if user uploads one)
let updateTimer = null;

// Curated palette: navy/blue, neutrals, cream, reds.
const PALETTE = [
  '#FFFFFF','#F5F4F1','#E7E5E4','#CBD5E1','#94A3B8','#475569','#1E293B','#0F172A','#000000',
  '#082F49','#0C4A6E','#0369A1','#0284C7','#38BDF8','#E0F2FE',
  '#991B1B','#B91C1C'
];

// ── Init ───────────────────────────────────────────────────
function init() {
  buildSwatches('sw-dot',  'dot-color',  'dot-hex');
  buildSwatches('sw-bg',   'bg-color',   'bg-hex');
  buildSwatches('sw-csq',  'csq-color',  'csq-hex');
  buildSwatches('sw-cdot', 'cdot-color', 'cdot-hex');
  const settings = document.querySelector('.settings');
  settings.addEventListener('input', e => { if (e.target.closest('details')) $('preset').value = ''; });
  settings.addEventListener('click', e => { if (e.target.closest('.pill,.swatch')) $('preset').value = ''; });
  renderTypeFields();
  applyPreset('navy');
}

function buildSwatches(containerId, pickerId, hexId) {
  const el = $(containerId);
  PALETTE.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (c === '#FFFFFF' ? ' swatch-white' : '');
    btn.style.background = c;
    btn.title = c; btn.setAttribute('aria-label','Choose ' + c);
    btn.onclick = () => {
      $(pickerId).value = c;
      $(hexId).value = c.toUpperCase();
      scheduleUpdate();
    };
    el.appendChild(btn);
  });
}

// ── Color sync ─────────────────────────────────────────────
function syncHex(picker, hexId) {
  $(hexId).value = picker.value.toUpperCase();
}
function syncPicker(hexInput, pickerId) {
  if (/^#[0-9A-Fa-f]{6}$/.test(hexInput.value)) {
    $(pickerId).value = hexInput.value;
  }
}

// ── Pills ──────────────────────────────────────────────────
function setPill(groupId, btn) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(p => {
    p.classList.toggle('on',p === btn);
    p.setAttribute('aria-pressed', String(p === btn));
  });
}
function activePill(groupId) {
  return document.querySelector(`#${groupId} .pill.on`)?.dataset.v ?? 'square';
}

// ── Transparent BG ─────────────────────────────────────────
function onTransparentBg() {
  const disabled = $('transparent-bg').checked;
  $('bg-color-wrap').classList.toggle('disabled',disabled);
  document.querySelectorAll('#bg-color-wrap input,#sw-bg button').forEach(el => { el.disabled = disabled; });
  scheduleUpdate();
}

// ── Gradient ───────────────────────────────────────────────
function onGradientToggle() {
  $('gradient-opts').style.display = $('use-gradient').checked ? 'grid' : 'none';
  scheduleUpdate();
}

// ── Logo ───────────────────────────────────────────────────
function onLogoToggle() {
  $('logo-opts').style.display = $('use-logo').checked ? '' : 'none';
  scheduleUpdate();
}
let logoRevision = 0;
function onLogoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const revision = ++logoRevision;
  const reader = new FileReader();
  reader.onload = () => {
    if (revision !== logoRevision) return;
    logoDataUrl = reader.result;
    $('logo-preview').src = logoDataUrl;
    $('logo-preview').hidden = false;
    $('logo-label').textContent = file.name;
    $('remove-logo').hidden = false;
    scheduleUpdate();
  };
  reader.readAsDataURL(file);
}
function clearLogo() {
  logoRevision++;
  logoDataUrl = null;
  $('logo-file').value = '';
  $('logo-label').textContent = 'Choose image';
  $('logo-preview').removeAttribute('src');
  $('logo-preview').hidden = true;
  $('remove-logo').hidden = true;
  scheduleUpdate();
}
function clearContent() {
  document.querySelectorAll('#type-fields input, #type-fields textarea, #type-fields select')
    .forEach(el => { el.value = el.tagName === 'SELECT' ? el.options[0].value : ''; });
  scheduleUpdate();
}

// ── Debounce ───────────────────────────────────────────────
function scheduleUpdate() {
  $('download').disabled = true;
  clearTimeout(updateTimer);
  updateTimer = setTimeout(generateQR, 180);
}

// ── Generate ───────────────────────────────────────────────
function generateQR() {
  const url = buildQrData();
  const mount = $('qr-mount');

  qrCode = null;
  $('download').disabled = true;
  if (!url) {
    mount.innerHTML = '<div class="qr-empty"><svg class="icon" aria-hidden="true"><use href="#i-qr"></use></svg><p>Enter content to preview your code.</p></div>';
    return;
  }

  const size          = parseInt($('qr-size').value);
  const margin        = parseInt($('qr-margin').value);
  const ecl           = $('ecl').value;
  const useGrad       = $('use-gradient').checked;
  const useLogo       = $('use-logo').checked;
  const transparent   = $('transparent-bg').checked;

  const dotColor      = $('dot-color').value;
  const bgColor       = $('bg-color').value;
  const csqColor      = $('csq-color').value;
  const cdotColor     = $('cdot-color').value;
  const gradStart     = $('grad-start').value;
  const gradEnd       = $('grad-end').value;
  const gradType      = $('grad-type').value;
  const gradRotDeg    = parseFloat($('grad-rot').value);

  const dotStyle      = activePill('pills-dot');
  const csqStyle      = activePill('pills-csq');
  const cdotStyle     = activePill('pills-cdot');

  const logoSize      = parseFloat($('logo-size').value);
  const logoMargin    = parseInt($('logo-margin').value);
  const hideBgDots    = $('hide-bg-dots').checked;

  const dotsOptions = useGrad ? {
    type: dotStyle,
    gradient: {
      type: gradType,
      rotation: gradRotDeg * Math.PI / 180,
      colorStops: [
        { offset: 0, color: gradStart },
        { offset: 1, color: gradEnd }
      ]
    }
  } : { type: dotStyle, color: dotColor };

  const bgOptions = transparent ? { color: 'rgba(0,0,0,0)' } : { color: bgColor };

  const opts = {
    width: size,
    height: size,
    type: 'canvas',
    data: url,
    margin,
    qrOptions:             { errorCorrectionLevel: ecl },
    dotsOptions,
    backgroundOptions:     bgOptions,
    cornersSquareOptions:  { type: csqStyle,  color: csqColor  },
    cornersDotOptions:     { type: cdotStyle, color: cdotColor },
    imageOptions:          { hideBackgroundDots: hideBgDots, imageSize: logoSize, margin: logoMargin, crossOrigin: 'anonymous' }
  };

  if (useLogo && logoDataUrl) opts.image = logoDataUrl;

  mount.innerHTML = '';
  try {
    qrCode = new QRCodeStyling(opts);
    qrCode.append(mount);
    $('download').disabled = false;
  } catch {
    qrCode = null;
    mount.textContent = 'This content could not be encoded.';

  }
}

// ── Download ───────────────────────────────────────────────
function doDownload() {
  if (!qrCode) { alert('Enter a URL first to generate a QR code.'); return; }
  const fmt = $('export-format').value;
  const name = $('filename').value.trim() || 'qr-code';
  qrCode.download({ name, extension: fmt });
}

// ── Presets ────────────────────────────────────────────────
// `useLogo` true/false sets the toggle; logo is only rendered if a file
// has actually been uploaded by the user. omitted → leave toggle alone.
const PRESETS = {
  // ── Professional / classic ──
  classic: {
    dotStyle:'square', csqStyle:'square', cdotStyle:'square',
    dotColor:'#000000', bgColor:'#FFFFFF', csqColor:'#000000', cdotColor:'#000000',
    gradient:false, useLogo:false
  },
  monoLight: {
    dotStyle:'dots', csqStyle:'square', cdotStyle:'dot',
    dotColor:'#1E293B', bgColor:'#FFFFFF', csqColor:'#1E293B', cdotColor:'#1E293B',
    gradient:false, useLogo:false
  },
  monoDark: {
    dotStyle:'rounded', csqStyle:'square', cdotStyle:'square',
    dotColor:'#E2E8F0', bgColor:'#0F172A', csqColor:'#E2E8F0', cdotColor:'#94A3B8',
    gradient:false, useLogo:false
  },
  navy: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#082F49', bgColor:'#E7E5E4', csqColor:'#082F49', cdotColor:'#0369A1',
    gradient:false, useLogo:false
  },
  midnight: {
    dotStyle:'extra-rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#E0F2FE', bgColor:'#082F49', csqColor:'#38BDF8', cdotColor:'#E7E5E4',
    gradient:false, useLogo:false
  },
  ocean: {
    dotStyle:'extra-rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#0C4A6E', bgColor:'#FFFFFF', csqColor:'#082F49', cdotColor:'#0284C7',
    gradient:false, useLogo:false
  },
  slate: {
    dotStyle:'classy-rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#334155', bgColor:'#F5F4F1', csqColor:'#0F172A', cdotColor:'#475569',
    gradient:false, useLogo:false
  },
  paper: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#1E293B', bgColor:'#E7E5E4', csqColor:'#0F172A', cdotColor:'#334155',
    gradient:false, useLogo:false
  },

  // ── With a touch of red ──
  crimson: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#991B1B', bgColor:'#F5F4F1', csqColor:'#7F1D1D', cdotColor:'#1E293B',
    gradient:false, useLogo:false
  },
  brick: {
    dotStyle:'classy-rounded', csqStyle:'square', cdotStyle:'dot',
    dotColor:'#B91C1C', bgColor:'#E7E5E4', csqColor:'#1E293B', cdotColor:'#1E293B',
    gradient:false, useLogo:false
  },

  // ── Soft gradients ──
  steel: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#082F49', bgColor:'#FFFFFF', csqColor:'#082F49', cdotColor:'#0369A1',
    gradient:true, gradStart:'#082F49', gradEnd:'#0369A1', gradType:'linear', gradRot:135,
    useLogo:false
  },
  aqua: {
    dotStyle:'extra-rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#0369A1', bgColor:'#FFFFFF', csqColor:'#0C4A6E', cdotColor:'#38BDF8',
    gradient:true, gradStart:'#0369A1', gradEnd:'#38BDF8', gradType:'linear', gradRot:45,
    useLogo:false
  },
  dusk: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#082F49', bgColor:'#F5F4F1', csqColor:'#082F49', cdotColor:'#991B1B',
    gradient:true, gradStart:'#082F49', gradEnd:'#991B1B', gradType:'linear', gradRot:90,
    useLogo:false
  },

  // ── Creative / detailed ──
  editorial: {
    dotStyle:'classy', csqStyle:'square', cdotStyle:'square',
    dotColor:'#0F172A', bgColor:'#E7E5E4', csqColor:'#0F172A', cdotColor:'#0F172A',
    gradient:false, useLogo:false
  },
  dotsMin: {
    dotStyle:'dots', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#082F49', bgColor:'#FFFFFF', csqColor:'#082F49', cdotColor:'#0369A1',
    gradient:false, useLogo:false
  },

  // ── Transparent ──
  transparent: {
    dotStyle:'rounded', csqStyle:'extra-rounded', cdotStyle:'dot',
    dotColor:'#082F49', bgColor:'#FFFFFF', csqColor:'#082F49', cdotColor:'#0369A1',
    gradient:false, useLogo:false, transparent:true
  }
};

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  $('preset').value = name;

  for (const [group,style] of [['pills-dot',p.dotStyle],['pills-csq',p.csqStyle],['pills-cdot',p.cdotStyle]]) {
    setPill(group,document.querySelector(`#${group} .pill[data-v="${style}"]`));
  }

  // Colors
  const setColor = (pickId, hexId, val) => {
    $(pickId).value = val;
    $(hexId).value  = val.toUpperCase();
  };
  setColor('dot-color',  'dot-hex',  p.dotColor);
  setColor('bg-color',   'bg-hex',   p.bgColor);
  setColor('csq-color',  'csq-hex',  p.csqColor);
  setColor('cdot-color', 'cdot-hex', p.cdotColor);

  // Gradient
  $('use-gradient').checked = !!p.gradient;
  onGradientToggle();
  if (p.gradient) {
    setColor('grad-start', 'grad-start-hex', p.gradStart);
    setColor('grad-end',   'grad-end-hex',   p.gradEnd);
    $('grad-type').value = p.gradType;
    $('grad-rot').value  = p.gradRot ?? 45;
    $('grad-rot-val').textContent = (p.gradRot ?? 45) + '°';
  }

  // Transparent bg
  $('transparent-bg').checked = !!p.transparent;
  onTransparentBg();

  // Logo toggle (only if preset specifies)
  if (typeof p.useLogo === 'boolean') {
    $('use-logo').checked = p.useLogo;
    onLogoToggle();
  }

  scheduleUpdate();
}

function resetAll() {
  clearLogo();
  $('use-logo').checked = false;
  onLogoToggle();
  $('export-format').value = 'png';
  for (const id of ['qr-size','qr-margin','ecl','logo-size','logo-margin','hide-bg-dots']) {
    const field = $(id);
    if (field.type === 'checkbox') field.checked = field.defaultChecked;
    else if (field.tagName === 'SELECT') field.value = field.querySelector('[selected]').value;
    else { field.value = field.defaultValue; field.dispatchEvent(new Event('input')); }
  }
  applyPreset('navy');
}

// ── Run ────────────────────────────────────────────────────
init();
</script>
